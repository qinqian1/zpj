<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>范德荟 2026｜商业化体验设计作品集</title>
  <link rel="stylesheet" href="./viewer.css">
  <script>
    window.goatcounter = {
      path: '/slide/01',
      title: '作品集第 1 页'
    };
  </script>
  <script
    data-goatcounter="https://fandehui-portfolio.goatcounter.com/count"
    async
    src="https://gc.zgo.at/count.js"
  ></script>
</head>
<body>
  <main class="viewer">
    <aside class="sidebar" aria-label="PPT 页面缩略图导航">
      <header class="sidebar-header">
        <strong>PORTFOLIO</strong>
        <span>2026</span>
      </header>
      <nav class="thumbnails" id="thumbnails"></nav>
    </aside>

    <section class="stage" aria-label="作品集页面">
      <div class="ambient" aria-hidden="true"></div>
      <div class="slide-frame">
        <picture>
          <source
            id="sourceA"
            type="image/avif"
            srcset="./public/slides-avif-1920/slide-01.avif?v=hd6 1920w, ./public/slides-avif-3200/slide-01.avif?v=hd6 3200w"
            sizes="(max-width: 720px) 100vw, 86vw"
          >
          <source
            id="webpSourceA"
            type="image/webp"
            srcset="./public/slides-webp-1920/slide-01.webp?v=hd6 1920w, ./public/slides-webp-3200/slide-01.webp?v=hd6 3200w"
            sizes="(max-width: 720px) 100vw, 86vw"
          >
          <img
            id="slideA"
            class="master-slide slide-active"
            src="./public/slides-master/slide-01.png?v=hd6"
            alt="作品集第 1 页"
            width="5120"
            height="2880"
            fetchpriority="high"
          >
        </picture>
        <picture>
          <source id="sourceB" type="image/avif">
          <source id="webpSourceB" type="image/webp">
          <img id="slideB" class="master-slide" alt="" width="5120" height="2880">
        </picture>
      </div>
      <div class="page-status" aria-live="polite">
        <span id="currentPage">01</span>
        <i></i>
        <span>79</span>
      </div>
      <div class="keyboard-tip">方向键 / 滚轮翻页</div>
    </section>
  </main>

  <script>
    const total = 79;
    const assetVersion = 'hd6';
    const masterSizes = '(max-width: 720px) 100vw, 86vw';
    const pageNumber = page => String(page).padStart(2, '0');
    const pngFile = page => `./public/slides-master/slide-${pageNumber(page)}.png?v=${assetVersion}`;
    const avifFile = (page, width) => `./public/slides-avif-${width}/slide-${pageNumber(page)}.avif?v=${assetVersion}`;
    const webpFile = (page, width) => `./public/slides-webp-${width}/slide-${pageNumber(page)}.webp?v=${assetVersion}`;
    const avifSrcset = page => `${avifFile(page, 1920)} 1920w, ${avifFile(page, 3200)} 3200w`;
    const webpSrcset = page => `${webpFile(page, 1920)} 1920w, ${webpFile(page, 3200)} 3200w`;
    const thumbnailFile = page => `./public/thumbnails/slide-${pageNumber(page)}.jpg?v=${assetVersion}`;
    const thumbnails = document.getElementById('thumbnails');
    const currentPage = document.getElementById('currentPage');
    const slides = [document.getElementById('slideA'), document.getElementById('slideB')];
    const sources = [document.getElementById('sourceA'), document.getElementById('sourceB')];
    const webpSources = [document.getElementById('webpSourceA'), document.getElementById('webpSourceB')];
    const preloads = new Map();
    let front = 0;
    let active = 1;
    let locked = false;

    for (let page = 1; page <= total; page += 1) {
      const button = document.createElement('button');
      button.className = 'thumbnail';
      button.dataset.page = page;
      button.setAttribute('aria-label', `前往第 ${page} 页`);
      button.innerHTML = `
        <span>${String(page).padStart(2, '0')}</span>
        <img src="${thumbnailFile(page)}" alt="" loading="${page < 4 ? 'eager' : 'lazy'}" decoding="async">
      `;
      button.addEventListener('click', () => show(page));
      thumbnails.appendChild(button);
    }

    const thumbnailButtons = [...document.querySelectorAll('.thumbnail')];
    thumbnailButtons[0].classList.add('active');
    thumbnailButtons[0].setAttribute('aria-current', 'page');

    async function prepareImage(image, source, webpSource, page) {
      source.srcset = avifSrcset(page);
      source.sizes = masterSizes;
      webpSource.srcset = webpSrcset(page);
      webpSource.sizes = masterSizes;
      image.src = pngFile(page);
      if (image.decode) {
        await image.decode();
        return;
      }
      if (!image.complete) {
        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = reject;
        });
      }
    }

    function preloadPage(page) {
      if (page < 1 || page > total || preloads.has(page)) return;
      const picture = document.createElement('picture');
      const source = document.createElement('source');
      const webpSource = document.createElement('source');
      const image = new Image();
      picture.hidden = true;
      source.type = 'image/avif';
      source.srcset = avifSrcset(page);
      source.sizes = masterSizes;
      webpSource.type = 'image/webp';
      webpSource.srcset = webpSrcset(page);
      webpSource.sizes = masterSizes;
      image.src = pngFile(page);
      picture.append(source, webpSource, image);
      document.body.appendChild(picture);
      preloads.set(page, picture);
    }

    function preloadAhead(page) {
      preloads.forEach((picture, preloadedPage) => {
        if (preloadedPage <= page || preloadedPage > page + 2) {
          picture.remove();
          preloads.delete(preloadedPage);
        }
      });
      preloadPage(page + 1);
      preloadPage(page + 2);
    }

    function trackPage(page) {
      if (!window.goatcounter || !window.goatcounter.count) return;
      const pageNumber = String(page).padStart(2, '0');
      window.goatcounter.count({
        path: `/slide/${pageNumber}`,
        title: `作品集第 ${page} 页`
      });
    }

    async function show(page) {
      const next = Math.max(1, Math.min(total, page));
      if (next === active || locked) return;
      locked = true;
      const back = front === 0 ? 1 : 0;
      const nextSlide = slides[back];
      await prepareImage(nextSlide, sources[back], webpSources[back], next);
      active = next;
      trackPage(active);
      currentPage.textContent = String(active).padStart(2, '0');
      nextSlide.alt = `作品集第 ${active} 页`;
      thumbnailButtons.forEach((button, index) => {
        button.classList.toggle('active', index + 1 === active);
        button.setAttribute('aria-current', index + 1 === active ? 'page' : 'false');
      });
      thumbnailButtons[active - 1].scrollIntoView({ block: 'center', behavior: 'smooth' });

      requestAnimationFrame(() => {
        slides[front].classList.remove('slide-active');
        nextSlide.classList.add('slide-active');
        window.setTimeout(() => {
          front = back;
          locked = false;
          preloadAhead(active);
        }, 140);
      });
    }

    if (slides[0].complete) {
      preloadAhead(1);
    } else {
      slides[0].addEventListener('load', () => preloadAhead(1), { once: true });
    }

    window.addEventListener('keydown', event => {
      if (event.key === 'ArrowDown' || event.key === 'ArrowRight' || event.key === 'PageDown' || event.key === ' ') {
        event.preventDefault();
        show(active + 1);
      }
      if (event.key === 'ArrowUp' || event.key === 'ArrowLeft' || event.key === 'PageUp') {
        event.preventDefault();
        show(active - 1);
      }
      if (event.key === 'Home') show(1);
      if (event.key === 'End') show(total);
    });

    document.querySelector('.stage').addEventListener('wheel', event => {
      if (Math.abs(event.deltaY) < 12) return;
      event.preventDefault();
      show(active + (event.deltaY > 0 ? 1 : -1));
    }, { passive: false });

  </script>
</body>
</html>
